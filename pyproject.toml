[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "zapisnikar"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "Django==6.1.2",
    "django-huey==1.3.1",
    "django-redis==7.0.0",
    "tuspy==1.1.0",
    "google-genai==2.34.0",
    "langchain==1.4.7",
    "langchain-google-genai==4.4.2",
    "gunicorn==26.2.0",
    "psycopg2-binary==2.9.13",
    "boto3==1.43.123",
    "django-storages==1.14.6",
]

[dependency-groups]
dev = [
    "black==26.10.1",
    "django-stubs==6.1.2",
    "django-stubs-ext==6.1.2",
    "ipython==9.18.0",
    "isort",
]

[tool.setuptools.packages.find]
include = ["agent*", "storyteller*"]

[tool.black]
line-length = 88

[tool.isort]
profile = "black"
