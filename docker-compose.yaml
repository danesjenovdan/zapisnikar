services:
  valkey:
    image: valkey/valkey:7.2.10
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - valkey_data:/data
    command: >
      --requirepass "geslo"

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: zapisniki
      POSTGRES_USER: zapisniki
      POSTGRES_PASSWORD: zapisniki
    volumes:
      - pgdata:/var/lib/postgresql/data

  django:
    build: .
    ports:
      - 8000:8000
    restart: unless-stopped
    volumes:
      - ./:/app
    environment:
      - DJANGO_SETTINGS_MODULE=zapisniki.settings
      - TIPKO_API_ENDPOINT=https://tipko.si
      - TIPKO_API_USERNAME=username
      - TIPKO_API_PASSWORD=password
      - REDIS_URL=redis
      - GOOGLE_API_KEY=key
      - AWS_SECRET_ACCESS_KEY=key
      - AWS_ACCESS_KEY_ID=id
      - ENABLE_S3=
      - AWS_STORAGE_BUCKET_NAME=zapisnikar
      - AWS_LOCATION=media
      - DATABASE_HOST=db
      - DATABASE_NAME=zapisniki
      - DATABASE_USER=zapisniki
      - DATABASE_PASSWORD=zapisniki
      - REDIS_PASSWORD=geslo
      - REDIS_DB=2

    depends_on:
      - valkey

  huey:
    build: .
    restart: unless-stopped
    volumes:
      - ./:/app
    command: ["python", "manage.py", "run_huey"]
    environment:
      - DJANGO_SETTINGS_MODULE=zapisniki.settings
      - TIPKO_API_ENDPOINT=https://tipko.si
      - TIPKO_API_USERNAME=username
      - TIPKO_API_PASSWORD=password
      - REDIS_URL=redis
      - GOOGLE_API_KEY=key
      - AWS_SECRET_ACCESS_KEY=key
      - AWS_ACCESS_KEY_ID=id
      - ENABLE_S3=
      - AWS_STORAGE_BUCKET_NAME=zapisnikar
      - AWS_LOCATION=media
      - DATABASE_HOST=db
      - DATABASE_NAME=zapisniki
      - DATABASE_USER=zapisniki
      - DATABASE_PASSWORD=zapisniki
      - REDIS_PASSWORD=geslo
      - REDIS_DB=2
    depends_on:
      - valkey

